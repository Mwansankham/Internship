<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Utility Simulator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f3f5f9;
      padding:30px;
    }

    .container{
      width:90%;
      margin:auto;
    }

    /* Header */
    .navbar{
      background:#16233d;
      color:white;
      padding:15px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .menu a{
      color:white;
      text-decoration:none;
      margin-left:20px;
    }

    /* Feature Boxes */
    .features{
      display:flex;
      gap:20px;
      margin:30px 0;
    }

    .feature-box{
      flex:1;
      background:#dfe8f7;
      padding:25px;
      text-align:center;
      border-radius:6px;
    }

    /* Main Section */
    .main{
      display:flex;
      gap:20px;
    }

    /* Left Form */
    .controls{
      flex:1;
      background:white;
      padding:20px;
      border-radius:8px;
      box-shadow:0 0 5px rgba(0,0,0,0.1);
    }

    .controls h3{
      margin-bottom:20px;
    }

    .controls label{
      display:block;
      margin:15px 0 5px;
    }

    .controls select{
      width:100%;
      padding:10px;
    }

    /* Right Card */
    .preview{
      flex:1;
      background:#e9edf4;
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .card{
      background:#2563eb;
      color:white;
      padding:25px;
      width:250px;
      box-shadow:0 4px 10px rgba(21, 19, 19, 0.2);
    }

    .card h4{
      margin-bottom:10px;
    }

    /* Buttons */
    .buttons{
      margin-top:25px;
      margin-left: 20px;
    }

    .buttons button{
      background:#3559a6;
      color:white;
      border:none;
      padding:10px 15px;
      margin-right:10px;
      cursor:pointer;
    }

    .buttons button:hover{
      background:#15c042;
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- Navbar -->
    <div class="navbar">
      <h2>MyLogo</h2>

      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <!-- Feature Boxes -->
    <div class="features">
      <div class="feature-box">Feature 1</div>
      <div class="feature-box">Feature 2</div>
      <div class="feature-box">Feature 3</div>
    </div>

    <!-- Main Section -->
    <div class="main">

      <!-- Left -->
      <div class="controls">
        <h3>Utility Controls</h3>

        <label>Padding (Spacing)</label>
        <select>
          <option>Medium (p-6)</option>
        </select>

        <label>Background Theme</label>
        <select>
          <option>Primary Blue</option>
        </select>

        <label>Text Size</label>
        <select>
          <option>Large</option>
        </select>

        <label>Corner Radius</label>
        <select>
          <option>Square</option>
        </select>

        <label>Shadow</label>
        <select>
          <option>Medium</option>
        </select>

        <div class="buttons">
          <button>Submit</button>
          <button>Hover Me Slowly!</button>
        </div>
      </div>

      <!-- Right -->
      <div class="preview">
        <div class="card">
          <h4>Alex Walker</h4>
          <p>
            Full-Stack Web Developer building awesome things with Tailwind CSS.
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
